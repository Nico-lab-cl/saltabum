name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_GOOGLE_ADS_ID: ${{ vars.PUBLIC_GOOGLE_ADS_ID }}
      PUBLIC_GOOGLE_ADS_LEAD_LABEL: ${{ vars.PUBLIC_GOOGLE_ADS_LEAD_LABEL }}
      PUBLIC_GOOGLE_ADS_WHATSAPP_LABEL: ${{ vars.PUBLIC_GOOGLE_ADS_WHATSAPP_LABEL }}
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
      PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Deploy a Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
